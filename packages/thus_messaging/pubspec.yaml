name: thus_messaging
description: Messaging domain (chat, message entities, use cases, blocs) for Thus apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.1.0
  fpdart: ^1.1.0
  json_annotation: ^4.9.0
  thus_auth:
    path: ../thus_auth
  thus_core:
    path: ../thus_core
  thus_network:
    path: ../thus_network
  thus_storage:
    path: ../thus_storage

dev_dependencies:
  bloc_test: ^9.1.7
  build_runner: ^2.4.11
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  http: ^1.2.1
  json_serializable: ^6.8.0
  lints: ^6.0.0
  test: ^1.25.8
  very_good_analysis: ^6.0.0
