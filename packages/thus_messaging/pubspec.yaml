name: thus_messaging
description: Messaging domain (chat, message entities, use cases, blocs) for Thus apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.3

dependencies:
  bloc: ^8.1.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  get_it: ^7.6.0
  hive_ce: ^2.5.0
  injectable: ^2.3.5
  json_annotation: ^4.9.0
  stream_transform: ^2.1.0
  thus_core:
    path: ../thus_core
  thus_network:
    path: ../thus_network
  thus_storage:
    path: ../thus_storage

dev_dependencies:
  build_runner: ^2.4.11
  freezed: ^2.4.6
  hive_ce_generator: ^1.8.1
  injectable_generator: ^2.4.1
  lints: ^6.0.0
  very_good_analysis: ^6.0.0
