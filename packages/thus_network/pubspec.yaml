name: thus_network
description: Networking (REST, WebSocket, SSE) layer for Thus apps using Dio.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.3

dependencies:
  dio: ^5.4.1
  equatable: ^2.0.5
  get_it: ^7.6.0
  injectable: ^2.3.5
  stream_transform: ^2.1.0
  thus_core:
    path: ../thus_core
  web_socket_channel: ^2.4.0

dev_dependencies:
  build_runner: ^2.4.11
  injectable_generator: ^2.4.1
  lints: ^6.0.0
  very_good_analysis: ^6.0.0
