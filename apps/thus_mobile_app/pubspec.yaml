name: thus_mobile_app
description: Thus mobile Flutter client powered by EvoBase auth and SSE.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  flutter_hooks: ^0.20.5
  fpdart: ^1.1.0
  go_router: ^14.6.3
  path_provider: ^2.1.3
  thus_auth:
    path: ../../packages/thus_auth
  thus_contacts:
    path: ../../packages/thus_contacts
  thus_core:
    path: ../../packages/thus_core
  thus_messaging:
    path: ../../packages/thus_messaging
  thus_network:
    path: ../../packages/thus_network
  thus_storage:
    path: ../../packages/thus_storage

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.1.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
