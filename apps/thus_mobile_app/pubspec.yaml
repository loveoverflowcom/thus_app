name: thus_mobile_app
description: Thus mobile Flutter client (WhatsApp-like, key-based auth).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.3
  flutter: ">=3.24.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  get_it: ^7.6.0
  injectable: ^2.3.5
  path_provider: ^2.1.3
  thus_auth:
    path: ../../packages/thus_auth
  thus_core:
    path: ../../packages/thus_core
  thus_messaging:
    path: ../../packages/thus_messaging
  thus_network:
    path: ../../packages/thus_network
  thus_storage:
    path: ../../packages/thus_storage
  equatable: ^2.0.5

dev_dependencies:
  build_runner: ^2.4.11
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
